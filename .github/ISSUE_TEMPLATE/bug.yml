name: Bug report
description: Report a DroidOps problem to Danksy.
body:
  - type: input
    id: version
    attributes:
      label: DroidOps version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps, expected result and Windows version. Remove personal details from logs.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt

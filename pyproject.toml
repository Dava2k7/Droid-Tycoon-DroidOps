[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danksy-droidops"
dynamic = ["version", "dependencies"]
description = "Danksy's Windows desktop tools for Droid Tycoon"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Danksy"}]
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]

[project.gui-scripts]
droidops = "droidops.launcher:main"

[tool.setuptools.dynamic]
version = {attr = "droidops.__version__"}
dependencies = {file = ["requirements-runtime.txt"]}

[tool.setuptools.packages.find]
include = ["droidops*"]

[tool.setuptools.package-data]
droidops = ["assets/*", "assets/droid_alerts/*", "assets/tessdata/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
